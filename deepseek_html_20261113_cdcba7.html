/* ====== LOGIC ====== */
const showBtn = document.getElementById('showBtn');
const idiomList = document.getElementById('idiomList');
const statusEl = document.getElementById('status');
const searchBox = document.getElementById('searchBox');
let loaded = false;





function render(list) {
  idiomList.innerHTML = '';
  if (list.length === 0) {
    statusEl.textContent = 'No idioms found.';
    return;
  }
  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${item.idiom}</h3>
      <p><strong>Meaning:</strong> ${item.meaning}</p>
      <p class="ex">Example: ${item.example}</p>
    `;
    idiomList.appendChild(card);
  });
  statusEl.textContent = `Showing ${list.length} idioms`;
}

showBtn.addEventListener('click', () => {
  loaded = true;
  render(idioms);
  showBtn.textContent = 'Idioms Loaded ✓';
});

searchBox.addEventListener('input', () => {
  if (!loaded) { render(idioms); loaded = true; }
  const q = searchBox.value.toLowerCase().trim();
  const filtered = idioms.filter(i =>
    i.idiom.toLowerCase().includes(q) || i.meaning.toLowerCase().includes(q)
  );
  render(filtered);
});
